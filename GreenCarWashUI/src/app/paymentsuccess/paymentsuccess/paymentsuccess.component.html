<div class="success-page">
  <div class="success-card">
    <div class="anim-ring">
      <div class="checkmark-circle">
        <i class="bi bi-check-lg"></i>
      </div>
    </div>
    <h2 class="fw-bold mt-4 mb-1">Payment Successful!</h2>
    <p class="text-muted mb-4">Your car wash has been paid. We're generating your receipt now.</p>

    <div class="info-pills">
      <span class="info-pill"><i class="bi bi-shield-check me-1 text-success"></i>Secure Payment</span>
      <span class="info-pill"><i class="bi bi-receipt me-1 text-purple"></i>Receipt Ready</span>
      <span class="info-pill"><i class="bi bi-droplet-fill me-1 text-info"></i>Eco Wash</span>
    </div>

    <button class="btn-purple w-100 mt-4 py-3 rounded-pill fw-semibold" (click)="goToHome()">
      <i class="bi bi-file-earmark-text me-2"></i>View Receipt
    </button>
  </div>
</div>
